# Local development database (PostgreSQL, same major version family as RDS).
# Start: pnpm db:start   Stop: pnpm db:stop
services:
  postgres:
    image: postgres:17-alpine
    container_name: hono-homework-2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
