# SAM CLI config — https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html
version = 0.1

[default.global.parameters]
stack_name = "hono-homework-2"

[default.deploy.parameters]
resolve_s3 = true
s3_prefix = "hono-homework-2"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
# Region and CorsOrigin / BetterAuthUrl are passed by the GitHub Actions workflow
# (or on the command line for a manual deploy):
#   sam deploy --region <region> --parameter-overrides CorsOrigin=... BetterAuthUrl=...
