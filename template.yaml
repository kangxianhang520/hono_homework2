AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  hono_homework_2 (GitHub Inspector) — Hono/tRPC API on AWS Lambda behind
  API Gateway (HTTP API), with RDS PostgreSQL in the same VPC.
  VPC layout: 1 public subnet (NAT Gateway, the only subnet with direct
  internet access) + 2 private subnets in different AZs (Lambda + RDS).

Parameters:
  CorsOrigin:
    Type: String
    Description: Allowed browser origin for the web app, e.g. https://app.example.com
  BetterAuthUrl:
    Type: String
    Description: Public base URL of this API (API Gateway URL or custom domain), e.g. https://api.example.com
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  DbName:
    Type: String
    Default: app
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 15

Resources:
  # ---------------------------------------------------------------- Network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-vpc" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # Public subnet: only NAT Gateway lives here; the only subnet routed to the IGW.
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-public" }]

  # Private subnets (2 AZs): Lambda functions and the RDS instance.
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-private-a" }]

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-private-b" }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet

  # Private subnets reach the internet (api.github.com, Secrets Manager) via NAT.
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # ---------------------------------------------------------- Security groups
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: API Lambda - outbound only
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS PostgreSQL - only reachable from the API Lambda
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

  # ----------------------------------------------------------------- Database
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for RDS
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DbName
      MasterUsername: app_admin
      # RDS generates the password and keeps it in Secrets Manager (KMS-encrypted).
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      DeletionProtection: true

  # -------------------------------------------------------------- App secrets
  AuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: BETTER_AUTH_SECRET for the API
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  # ---------------------------------------------------------------------- API
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Hono + tRPC API (apps/server, bundled by tsdown)
      CodeUri: apps/server/dist-lambda/
      Handler: lambda.handler
      VpcConfig:
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
      Environment:
        Variables:
          NODE_ENV: production
          # Lambda Node.js 20+ runtimes need this to trust the RDS CA chain.
          NODE_EXTRA_CA_CERTS: /var/runtime/ca-cert.pem
          CORS_ORIGIN: !Ref CorsOrigin
          BETTER_AUTH_URL: !Ref BetterAuthUrl
          DB_HOST: !GetAtt Database.Endpoint.Address
          DB_PORT: !GetAtt Database.Endpoint.Port
          DB_NAME: !Ref DbName
          DB_SECRET_ARN: !GetAtt Database.MasterUserSecret.SecretArn
          AUTH_SECRET_ARN: !Ref AuthSecret
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !GetAtt Database.MasterUserSecret.SecretArn
                - !Ref AuthSecret
      Events:
        Root:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

  # Runs drizzle migrations from inside the VPC (CI cannot reach RDS).
  # Invoked by .github/workflows/deploy.yml right after `sam deploy`.
  MigrateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Applies packages/db migrations to RDS
      CodeUri: apps/server/dist-lambda-migrate/
      Handler: lambda-migrate.handler
      Timeout: 300
      VpcConfig:
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
      Environment:
        Variables:
          NODE_EXTRA_CA_CERTS: /var/runtime/ca-cert.pem
          DB_HOST: !GetAtt Database.Endpoint.Address
          DB_PORT: !GetAtt Database.Endpoint.Port
          DB_NAME: !Ref DbName
          DB_SECRET_ARN: !GetAtt Database.MasterUserSecret.SecretArn
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt Database.MasterUserSecret.SecretArn

  MigrateFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MigrateFunction}"
      RetentionInDays: 30

  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApiFunction}"
      RetentionInDays: 30

Outputs:
  ApiUrl:
    Description: API Gateway endpoint (use as VITE_SERVER_URL / BetterAuthUrl when no custom domain)
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabaseSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  VpcId:
    Value: !Ref Vpc
  MigrateFunctionName:
    Description: Invoked by CI after each deploy to apply DB migrations
    Value: !Ref MigrateFunction
